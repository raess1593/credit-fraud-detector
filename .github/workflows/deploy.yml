
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          docker build -t cfd-api -f Dockerfile.api .
          docker tag cfd-api:latest "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/credit-fraud-detector-dev-api:${{ github.sha }}"
          docker push "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/credit-fraud-detector-dev-api:${{ github.sha }}"

      - name: Build and push training image
        run: |
          docker build -t cfd-train -f Dockerfile.train .
          docker tag cfd-train:latest "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/credit-fraud-detector-dev-training:${{ github.sha }}"
          docker push "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/credit-fraud-detector-dev-training:${{ github.sha }}"

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      
      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_api_image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/credit-fraud-detector-dev-api:${{ github.sha }}
          TF_VAR_mlflow_image: ${{ env.MLFLOW_IMAGE }}
        run: |
          terraform init
          terraform apply -auto-approve
