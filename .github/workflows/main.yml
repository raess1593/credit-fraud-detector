name: Main Workflow

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    call-lint:
        uses: ./.github/workflows/lint.yml
    call-test:
        needs: call-lint
        uses: ./.github/workflows/test.yml
    call-deploy:
        needs: call-test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/workflows/deploy.yml
        secrets: inherit
