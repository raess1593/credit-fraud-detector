name: Main Workflow

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    call-lint:
        uses: ./.github/workflows/lint.yml

    call-test:
        needs: call-lint
        uses: ./.github/workflows/test.yml

    call-deploy:
        if: github.ref == 'refs/heads/fix/final' || github.head_ref == 'fix/final'
        uses: ./.github/workflows/deploy.yml
        secrets: inherit
